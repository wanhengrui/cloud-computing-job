global:
  threadmodel:
    default:
      - instance_name: default_instance
        io_handle_type: merge
        io_thread_num: 2

server:
  app: ride
  server: pricing
  admin_ip: 0.0.0.0
  admin_port: 18080
  service:
    - name: trpc.ride.pricing.PricingService
      protocol: trpc
      network: tcp
      ip: 0.0.0.0
      port: 8000

plugins:
  log:
    default:
      - name: default
        sinks:
          local_file:
            filename: /tmp/pricing-service.log
